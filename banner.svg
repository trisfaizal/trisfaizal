  <circle cx="940" cy="380" r="7" fill="#00FF9C"/>
  <text x="800" y="410" text-anchor="middle" fill="#8FFFE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">SECURE AUTOMATION :: OBSERVABILITY :: INFRASTRUCTURE SYSTEMS</text>
