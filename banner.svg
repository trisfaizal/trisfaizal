<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TRISF infrastructure command center banner</title>
  <desc id="desc">Lightweight futuristic DevSecOps dashboard banner for GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030607"/>
      <stop offset="0.5" stop-color="#08110F"/>
      <stop offset="1" stop-color="#020405"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FF9C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF9C"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00FF9C" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <path d="M0 64H1600M0 436H1600" stroke="url(#line)" stroke-width="2"/>
  <path d="M170 110H500M1100 110H1430M170 390H500M1100 390H1430" stroke="#00E5FF" stroke-opacity=".18"/>

  <rect x="70" y="92" width="330" height="130" rx="12" fill="#07100E" stroke="#1C3D37"/>
  <rect x="70" y="248" width="330" height="160" rx="12" fill="#07100E" stroke="#1C3D37"/>
  <rect x="1200" y="92" width="330" height="130" rx="12" fill="#07100E" stroke="#1C3D37"/>
  <rect x="1200" y="248" width="330" height="160" rx="12" fill="#07100E" stroke="#1C3D37"/>
  <rect x="450" y="70" width="700" height="360" rx="20" fill="#06100D" stroke="#00FF9C" stroke-opacity=".55"/>

  <text x="102" y="132" fill="#8FFFE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">SYSTEM OVERVIEW</text>
  <text x="102" y="168" fill="#00FF9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700">OPERATIONAL</text>
  <path d="M104 195C133 178 154 207 180 192C211 174 239 208 266 190C296 170 325 196 366 182" stroke="#00FF9C" stroke-width="3" stroke-linecap="round"/>

