  <text x="1228" y="174" fill="#00FF9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">SECURE</text>
  <text x="1228" y="201" fill="#B6C7C0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">No critical issues</text>
