  <text x="1230" y="378" fill="#F2FFF9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700">ENCRYPTED</text>

  <text x="498" y="112" fill="#00FF9C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">trisfaizal@infrastructure:~</text>
  <circle cx="1102" cy="106" r="5" fill="#00FF9C"/>
  <circle cx="1125" cy="106" r="5" fill="#00E5FF"/>
